<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="mx-auto h-12 w-12 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold">
        🔑
      </div>
      <h2 class="text-2xl font-semibold mt-4 text-gray-800">Nueva contraseña</h2>
      <p class="text-gray-500 mt-1">Ingresá tu nueva contraseña para continuar</p>
    </div>

    <!-- Form -->
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-gray-700 text-sm mb-1">Nueva contraseña</label>
        <input type="password" id="password" required
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label class="block text-gray-700 text-sm mb-1">Confirmar contraseña</label>
        <input type="password" id="confirmPassword" required
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" />
      </div>

      <button type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Guardar contraseña
      </button>
    </form>

    <!-- Estado -->
    <div id="statusBox" class="mt-6 text-center hidden"></div>

  </div>

  <script>
    const form = document.getElementById("resetForm");
    const statusBox = document.getElementById("statusBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();

      statusBox.classList.add("hidden");
      statusBox.innerHTML = "";

      if (password !== confirm) {
        showStatus("❌ Las contraseñas no coinciden.", false);
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      if (!code) {
        showStatus("❌ No se encontró un código válido.", false);
        return;
      }

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, password })
        });

        const data = await res.json();

        if (res.ok) {
          showStatus("✔ Contraseña actualizada correctamente 🎉", true);
          form.classList.add("hidden");
        } else {
          showStatus(data.message || "❌ No se pudo actualizar la contraseña.", false);
        }

      } catch (err) {
        showStatus("❌ Error de conexión con el servidor.", false);
      }
    });

    function showStatus(message, success) {
      statusBox.classList.remove("hidden");
      statusBox.innerHTML = `
        <p class="${success ? 'text-green-600' : 'text-red-600'} font-medium">${message}</p>
        ${success ? `<a href="/login" class="mt-3 inline-block text-blue-600 underline">Ir al login</a>` : ""}
      `;
    }
  </script>

</body>
</html>
