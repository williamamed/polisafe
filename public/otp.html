<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Verificación OTP — Example OAuth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <main class="w-full max-w-md p-6 bg-white rounded-2xl shadow-md">
    <header class="text-center mb-6">
      <div class="flex items-center justify-center mb-4">
        <div class="rounded-full bg-gradient-to-r from-yellow-400 to-orange-500 p-2">
          <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 1l9 4-9 4-9-4 9-4zm0 10l9 4-9 4-9-4 9-4z" fill="white"/>
          </svg>
        </div>
      </div>
      <h1 class="text-2xl font-semibold">Verificación de seguridad</h1>
      <p class="text-sm text-gray-500 mt-1">Ingresa el código OTP enviado a tu correo</p>
    </header>

    <form id="otpForm" class="space-y-4">
      <input type="hidden" id="email">

      <div class="flex justify-center gap-2">
        <!-- Inputs para código de 6 dígitos -->
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
        <input maxlength="1" class="otp w-10 h-12 text-center border rounded-md focus:ring-2 focus:ring-blue-400" />
      </div>

      <button type="submit" class="w-full py-2 rounded-md bg-blue-600 text-white font-medium hover:bg-blue-700">
        Verificar
      </button>

      <div class="text-center text-sm text-gray-500">
        <button type="button" id="resendBtn" class="text-blue-600 hover:underline">Reenviar código</button>
      </div>

      <div id="error" class="hidden text-red-600 text-sm mt-2"></div>
    </form>
  </main>

  <script>
    const qs = (name) => new URLSearchParams(location.search).get(name) || '';
    document.getElementById('email').value = qs('email');

    // manejo inputs OTP
    const inputs = document.querySelectorAll('.otp');
    inputs.forEach((input, idx) => {
      input.addEventListener('input', () => {
        if (input.value && idx < inputs.length - 1) {
          inputs[idx + 1].focus();
        }
      });
    });

    const form = document.getElementById('otpForm');
    const errorEl = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const code = Array.from(inputs).map(i => i.value).join('');
      const email = document.getElementById('email').value;

      try {
        const res = await fetch('/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, code })
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data?.error || 'OTP inválido';
          errorEl.classList.remove('hidden');
          return;
        }

        // OTP válido → redirigir a login o dashboard
        location.href = 'login.html';
      } catch (err) {
        console.error(err);
        errorEl.textContent = 'No se pudo conectar con el servidor';
        errorEl.classList.remove('hidden');
      }
    });

    document.getElementById('resendBtn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      try {
        await fetch('/auth/resend-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        alert('Código reenviado');
      } catch {
        alert('No se pudo reenviar el código');
      }
    });
  </script>
</body>
</html>
