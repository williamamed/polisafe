<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activación de cuenta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-full max-w-md bg-white shadow-lg rounded-xl p-8">
    <!-- Logo -->
    <div class="text-center mb-6">
      <div class="mx-auto h-12 w-12 rounded-full bg-blue-600 text-white flex items-center justify-center text-xl font-bold">
        A
      </div>
      <h2 class="text-2xl font-semibold mt-4 text-gray-800">Activando tu cuenta...</h2>
    </div>

    <!-- Estado -->
    <div id="statusBox" class="text-center">
      <p class="text-gray-600">Un momento, estamos validando tu activación 🔄</p>
    </div>

    <!-- Botón volver (se muestra solo al final) -->
    <div id="backBtn" class="hidden text-center mt-6">
      <a href="/login" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        Volver al Login
      </a>
    </div>
  </div>

  <script>
    async function activarUsuario() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");

      const statusBox = document.getElementById("statusBox");
      const backBtn = document.getElementById("backBtn");

      if (!code) {
        statusBox.innerHTML = `
          <p class="text-red-600 font-medium">❌ No se encontró un código de activación.</p>
        `;
        backBtn.classList.remove("hidden");
        return;
      }

      try {
        const res = await fetch(`/auth/activate?code=${code}`, {
          method: "GET"
        });

        const data = await res.json();

        if (res.ok) {
          statusBox.innerHTML = `
            <p class="text-green-600 font-semibold text-lg">✔ Tu cuenta ha sido activada correctamente 🎉</p>
            <p class="text-gray-700 mt-2">Ya podés iniciar sesión.</p>
          `;
        } else {
          statusBox.innerHTML = `
            <p class="text-red-600 font-semibold text-lg">❌ Error al activar la cuenta</p>
            <p class="text-gray-700 mt-2">${data.message || 'El código no es válido o expiró.'}</p>
          `;
        }
      } catch (err) {
        statusBox.innerHTML = `
          <p class="text-red-600 font-semibold text-lg">❌ Error de conexión</p>
          <p class="text-gray-700 mt-2">No pudimos comunicarnos con el servidor.</p>
        `;
      }

      backBtn.classList.remove("hidden");
    }

    activarUsuario();
  </script>

</body>
</html>
